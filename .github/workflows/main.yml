name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unzip and build
        run: |
          mkdir -p "$RUNNER_TEMP/src"
          unzip -q ./*.zip -d "$RUNNER_TEMP/src"
          cd "$RUNNER_TEMP/src/MiCTS-main"
          chmod +x gradlew
          ./gradlew :app:assembleMiCTSDebug
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/MiCTS/debug/*.apk "$GITHUB_WORKSPACE/out/"
      - uses: actions/upload-artifact@v4
        with:
          name: MiCTS-debug-apk
          path: out/*.apk
